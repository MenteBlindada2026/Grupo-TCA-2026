services:
  - type: web
    name: rumo-ao-equilibrio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
